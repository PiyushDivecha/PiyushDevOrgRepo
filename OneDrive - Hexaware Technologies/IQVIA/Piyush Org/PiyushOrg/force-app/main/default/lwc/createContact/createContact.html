<template>
  <lightning-card title="Create Contact">
    <div class="slds-p-around_medium">
      <lightning-input
        name="firstName"
        label="First Name"
        value={firstName}
        onchange={handleChange}
      ></lightning-input>

      <lightning-input
        name="lastName"
        label="Last Name"
        value={lastName}
        required
        onchange={handleChange}
      ></lightning-input>

      <lightning-input
        name="email"
        label="Email"
        type="email"
        value={email}
        onchange={handleChange}
      ></lightning-input>

      <lightning-button
        class="slds-m-top_small"
        variant="brand"
        label="Save"
        onclick={handleSave}
        disabled={isSaving}
      ></lightning-button>

      <template if:true={isSaving}>
        <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
      </template>
    </div>
  </lightning-card>
</template>
